name: pawlife
description: "PawLife"
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.12 es el mínimo real: el código usa Color.withValues, que no existe
  # en SDKs anteriores. La restricción ^3.5.0 que traía la otra rama era
  # más permisiva de lo que el código soporta.
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Traducciones de los widgets propios de Material (ver locale en main.dart).
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  flutter_foreground_task: ^11.0.3

  # Backend: autenticación anónima + persistencia de los paseos en Firestore.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
