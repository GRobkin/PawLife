name: pawlife
description: "PawLife"
publish_to: 'none'
version: 1.0.0+1

environment:
  # 3.12 es el mínimo real: el código usa Color.withValues, que no existe
  # en SDKs anteriores. La restricción ^3.5.0 que traía la otra rama era
  # más permisiva de lo que el código soporta.
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Traducciones de los widgets propios de Material (ver locale en main.dart).
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  flutter_foreground_task: ^11.0.3

  # Cliente de la API PHP (../apipaw). Todos los datos pasan por ahí: la app
  # ya no escribe en Firestore directamente, así que no está cloud_firestore.
  http: ^1.2.0

  # Firebase se queda SOLO para autenticar. El ID token que emite firebase_auth
  # es lo que el backend verifica para saber de quién son los datos.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0

  # Login con Google. Solo obtiene la credencial de Google; quien abre la
  # sesión sigue siendo firebase_auth, así el backend no nota la diferencia
  # entre entrar con email o con Google: recibe el mismo tipo de ID token.
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Se declara la carpeta entera y no cada archivo: así añadir una imagen
    # nueva no obliga a tocar este archivo otra vez.
    - assets/images/
