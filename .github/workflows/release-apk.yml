# Genera el APK de PawLife y lo publica como release en GitHub.
#
# Se dispara al subir una etiqueta de versión (v1.0.0, v1.0.1-beta.1...). El
# release queda publicado y el APK se baja desde:
#   https://github.com/GRobkin/PawLife/releases/latest/download/PawLife.apk
#
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   el .jks en base64 (base64 -w0 upload.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Sin ellos el APK se firma con la clave de depuración y NO sirve para publicar.

name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Acción de terceros: revisar y fijar a un commit antes del primer uso real.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # La misma versión con la que se probó en local.
          flutter-version: '3.47.2'
          cache: true

      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            {
              echo "storeFile=app/upload.jks"
              echo "storePassword=$STORE_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > android/key.properties
          else
            # Un APK firmado con la clave de depuración del ejecutor no sirve: la
            # firma cambia en cada compilación, Google rechaza el acceso porque la
            # huella no está en Firebase y Android no deja actualizar encima de la
            # versión anterior. Mejor no publicarlo.
            echo "::error::Faltan los secretos de firma (ANDROID_KEYSTORE_BASE64 y los otros tres). Corré tool/configurar-firma.ps1 una vez; ver docs/RELEASE_APK.md."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Un solo APK universal (sirve en cualquier teléfono Android) con un nombre
      # fijo: así el enlace .../releases/latest/download/PawLife.apk siempre baja
      # la última versión.
      - name: Compilar APK
        run: |
          # --build-number sube en cada ejecución (el versionCode ya no queda en
          # 1) y APP_VERSION deja ver dentro de la app qué versión es.
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk PawLife.apk
          sha256sum PawLife.apk > PawLife.apk.sha256

      # Lee la firma del APK ya compilado: si es la de depuración corta aquí, y si
      # no, deja la huella a la vista para registrarla en Firebase.
      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs PawLife.apk | tee firma.txt
          if grep -q "CN=Android Debug" firma.txt; then
            echo "::error::El APK quedó firmado con la clave de depuración."
            exit 1
          fi
          {
            echo "### Firma del APK"
            echo ""
            echo "Registrar estas huellas en Firebase (Configuración del proyecto > Tus apps > Android):"
            echo ""
            grep -E "SHA-(1|256) digest" firma.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" PawLife.apk PawLife.apk.sha256 \
            --latest --title "PawLife ${{ github.ref_name }}" \
            --notes "App de prueba para Android. Bajá PawLife.apk en el teléfono, abrilo y aceptá instalar. Firmado con clave de depuración."
